syntax = "proto3";

package market;

enum OrderSide {
  SIDE_UNSPECIFIED = 0;
  BID = 1;
  ASK = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;
}

message Order {
  OrderSide orderSide = 1;
  OrderType orderType = 2;
  double price = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  FILLED = 1;
  PARTIAL = 2;
  QUEUED = 3;
  REJECTED = 4;
}
